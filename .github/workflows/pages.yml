# Publishes the app to GitHub Pages every time main changes.
#
# It generates the sample data, then uploads the app/ folder as the site.
# Actions are pinned to exact commits so a changed tag can't alter the build.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

# Only the permissions Pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel a deploy that's in progress; run the next one after it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate sample data
        run: python3 tools/generate_data.py

      - name: Check every app file is available offline
        run: python3 tools/check_offline_files.py

      # A new version string makes browsers install the updated service
      # worker, which downloads fresh copies of the app for offline use.
      - name: Stamp the service worker with this commit
        run: |
          sed -i "s/^const VERSION = 'dev';/const VERSION = '${GITHUB_SHA:0:12}';/" app/sw.js
          grep -q "^const VERSION = '${GITHUB_SHA:0:12}';" app/sw.js

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
